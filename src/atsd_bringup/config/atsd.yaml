# ============================================================
#  АТСД-1М · параметры нижней подсистемы
#  Один файл на все узлы. Правится здесь, а не в коде.
# ============================================================

v5_bridge:
  ros__parameters:
    port: /dev/v5                # udev-симлинк, см. udev/99-atsd.rules
    baud: 115200

    # ── ГЕОМЕТРИЯ ──
    # Эти три числа определяют всю одометрию.
    # Подбираются рулеткой, паспортные значения врут на 2-3 %,
    # а это метр увода на дистанции 50 м.
    wheel_diameter_mm: 101.6
    track_mm: 410.0
    gear_ratio: 1.0

    cmd_rate_hz: 20.0
    cmd_timeout_s: 0.5           # дублирует watchdog в прошивке V5
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    use_brain_heading: false     # true — курс с гироскопа V5 вместо счисления

light_node:
  ros__parameters:
    headlight_pin: 18            # физический пин 12
    strip_pin: 13                # физический пин 33
    pwm_freq_hz: 200

    # ── ТОКОВЫЙ БЮДЖЕТ ──
    # Шина 12 В тянет около 1,4 А. Потолки не поднимать без
    # пересчёта: просадка уронит Raspberry посреди заезда.
    headlight_ceiling: 0.6
    strip_ceiling: 0.5

    ramp_time_s: 0.5             # плавный пуск, гасит бросок тока
    blink_period_s: 1.0
    beacon_period_s: 0.35
    dim_on_lock: true            # интерлок с замком
    tick_hz: 50.0
    dry_run: false

lock_node:
  ros__parameters:
    lock_pin: 19                 # физический пин 35
    door_sensor_pin: 27          # физический пин 13, геркон
    use_door_sensor: false       # включить, когда геркон будет установлен
    pulse_time_s: 0.4            # дольше держать нельзя: ED соленоида 10 %
    cooldown_s: 3.0
    dry_run: false

gnss_node:
  ros__parameters:
    port: /dev/gnss              # ttyAMA2, GPIO4/5 — см. udev и config.txt
    baud: 115200                 # целевая; из коробки модуль на 9600,
                                 # узел сам найдёт его перебором и переключит
    frame_id: gnss_link
    min_satellites: 4

    configure_module: true       # UBX-настройка при старте
    nav_rate_hz: 5.0             # решений в секунду вместо заводской одной
    save_config: true            # сохранить в батарейное ОЗУ модуля
    fix_timeout_s: 3.0           # молчит дольше — публикуем NO_FIX
    uere_m: 2.5                  # горизонтальная ошибка на единицу HDOP

battery_node:
  ros__parameters:
    i2c_bus: 1
    address: 0x36              # гейдж X1202, совместим с MAX17040
    cells: 4
    rate_hz: 1.0
    low_pct: 20.0

web_node:
  ros__parameters:
    mock: false                # true — телеметрия из имитатора, без робота
    port: 8080

# ── Драйвер камеры v4l2_camera ──
v4l2_camera:
  ros__parameters:
    video_device: /dev/video0
    pixel_format: MJPG           # без MJPG получите 5 кадров вместо 30
    output_encoding: rgb8
    image_size: [1280, 720]
    camera_frame_id: camera_link
    time_per_frame: [1, 30]

# ── Лидар LDROBOT D500 Kit (LD19), свой узел atsd_sensors ──
# Подключён к аппаратному UART: лидар только передаёт, 230400 бод.
# Скорость менять нельзя, она зашита в прошивку дальномера.
lidar_node:
  ros__parameters:
    port: /dev/lidar             # ttyAMA0, GPIO15 (пин 10)
    baud: 230400
    frame_id: laser_frame
    topic: scan

    bins: 455                    # точек в кадре: 4500 отсчётов/с при 10 Гц
    range_min: 0.05
    range_max: 12.0
    min_intensity: 0             # поднять, если ловит засветку от солнца
    invert: true                 # развёртка по часовой -> против, как в ROS
    angle_offset_deg: 0.0        # ставить, если корпус лидара повёрнут

    check_crc: true
    # Сектор, который закрывает грузовой отсек. Пары градусов,
    # [0.0, 0.0] — ничего не режем. Корма примерно [150.0, -150.0].
    crop_deg: [0.0, 0.0]
