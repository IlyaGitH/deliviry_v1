# АТСД-1М · параметры всех узлов
# USB: V5 /dev/v5, лидар /dev/lidar, камера /dev/camera · UART: GNSS /dev/gnss · I2C: X1202 0x36, MPU-6050 0x68
# GPIO: 18 фары, 13 лента, 19 замок, 26 зуммер, 27 геркон · 6 и 16 заняты X1202

v5_bridge:
  ros__parameters:
    port: /dev/v5
    baud: 115200
    reconnect_s: 2.0
    link_timeout_s: 0.5
    cmd_rate_hz: 20.0
    cmd_timeout_s: 0.5
    heartbeat_hz: 10.0
    obstacle_max_hz: 15.0
    require_feeds: [obstacle]
    feed_timeout_s: 1.0
    odom_source: brain
    wheel_diameter_mm: 101.6
    track_mm: 430.0
    gear_ratio: 1.0
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    point_ids: [kpp, admin, testing, depot]   # = узлы 0..3 прошивки

nav_node:
  ros__parameters:
    points_file: /opt/atsd/data/points.json  # точки в метрах карты, правятся в веб-интерфейсе
    roads_file: /opt/atsd/data/roads.json    # граф дорог и origin GPS, снимается road_mark
    map_frame: map
    odom_frame: odom
    v_max: 0.8                 # м/с, ровная скорость рейса (Brain пропускает до V_CRUISE в прошивке)
    arrive_m: 0.3              # до точки вдоль дороги, м
    lane_timeout_s: 0.5
    gnss_timeout_s: 2.0
    no_position_timeout_s: 20.0

light_node:
  ros__parameters:
    headlight_pin: 18
    strip_pin: 13
    pwm_freq_hz: 200
    headlight_ceiling: 0.6   # шина 12 В ~1,4 А
    strip_ceiling: 0.5
    ramp_time_s: 0.5
    blink_period_s: 1.0
    beacon_period_s: 0.35
    dim_on_lock: true
    tick_hz: 50.0
    dry_run: false

lock_node:
  ros__parameters:
    lock_pin: 19
    door_sensor_pin: 27
    use_door_sensor: false
    pulse_time_s: 0.4
    cooldown_s: 3.0
    block_while_moving: true
    zone_policy: warn        # off | warn | require — BLE-метка точки для открытия
    dry_run: false

buzzer_node:
  ros__parameters:
    buzzer_pin: 26
    enabled: true
    max_continuous_s: 2.0
    dry_run: false

signal_node:
  ros__parameters:
    enabled: true
    tick_hz: 5.0
    head_moving: 1.0
    head_drl: 0.3
    strip_level: 1.0
    strip_idle: 0.3
    approach_m: 1.8
    crosswalk_beep_s: 4.0
    alarm_s: 6.0

obstacle_node:
  ros__parameters:
    scan_topic: scan
    laser_x: 0.29
    laser_y: 0.0
    laser_yaw_deg: 0.0
    front_x: 0.35            # замерить
    half_width: 0.25         # замерить
    margin: 0.10
    look_ahead: 2.5
    detour_offset: 0.65
    min_points: 3
    default_side: L
    on_count: 1              # сканов подряд для «есть препятствие»: лидар даёт 5 в секунду — реакция 0,2 с
    off_count: 2             # для «путь свободен» — 0,4 с
    report_offset: false

vision_node:
  ros__parameters:
    device: /dev/camera
    width: 640
    height: 480
    fps: 15
    model_path: /opt/atsd/models/signs_ncnn_model
    backend: auto            # ncnn без torch; ultralytics — запасной
    threads: 2               # ядра для YOLO; остальные — вебу, навигации, лидару
    imgsz: 640
    conf: 0.5
    infer_hz: 8.0            # разметка и красная метка
    yolo_hz: 3.0             # знаки и светофор (0,8 м/с — кадр каждые 27 см)
    focal_px: 460.0
    camera_to_front_m: 0.07
    sign_height_m: 0.30      # замерить
    light_height_m: 0.30     # замерить
    class_stop: [stop]
    class_cross: [crosswalk]
    class_bump: [bump_sign, bump_warn]
    class_light: [traffic_light]
    sign_confirm: 2
    light_confirm: 3
    max_sign_distance_m: 6.0
    light_lost_s: 2.0
    debug_image_hz: 4.0      # кадр с отрисовкой для отладочной страницы :8090, только пока она открыта
    debug_image_scale: 0.75  # 480×360, JPEG 50 — ~25 КБ на кадр
    hsv_s_min: 90
    hsv_v_min: 140
    spot_enabled: true
    camera_x: 0.28           # как static TF base_link -> camera_link
    camera_y: 0.0
    camera_z: 0.385
    camera_pitch_deg: 10.0
    spot_s_min: 110
    spot_v_min: 60
    spot_min_area_m2: 0.02
    spot_max_area_m2: 2.5
    spot_max_range_m: 3.5
    lane_enabled: true
    lane_width_m: 3.5        # ширина полосы, если видна одна линия
    lane_follow: center      # center — середина полосы; right — у правой линии на lane_keep_m
    lane_keep_m: 0.6
    lane_x_max_m: 6.0
    lane_thresh: 35          # насколько линия ярче асфальта; слабая краска — меньше
    lane_clutter_max: 0.25   # доля «краски» на виде сверху, выше — не дорога (окна, плитка, зебра)

ble_node:
  ros__parameters:
    point_ids: [kpp, admin, testing, depot]
    names: [ATSD-KPP, ATSD-ADMIN, ATSD-TEST, ATSD-SKLAD]
    ibeacon_uuid: E2C56DB5-DFFB-48D2-B060-D0F5A71096E0
    ibeacon_minors: [1, 2, 3, 4]
    near_rssi: -65
    hysteresis: 5
    lost_s: 4.0
    rate_hz: 2.0
    adapter: hci0
    near_m: 25.0             # ближе к точке — ищем метки постоянно; дальше — 3 с из 30 (BLE мешает Wi-Fi)

imu_node:
  ros__parameters:
    i2c_bus: 1               # GY-521: VCC 3,3 В (пин 1), GND (пин 6), SDA GPIO2 (пин 3), SCL GPIO3 (пин 5)
    address: 0x68            # 0x69, если AD0 платы на 3,3 В
    rate_hz: 100.0           # курсу хватает; 200 — лишняя нагрузка на Python
    gyro_range_dps: 500      # ±250 при ударах о стыки зашкаливает
    dlpf_hz: 41              # фильтр тряски: 250, 184, 92, 41, 20, 10, 5
    yaw_axis: z              # ось вверх: плата лежит ровно — z, стоит на ребре — x или y
    yaw_sign: 1.0            # поворот влево должен давать плюс; иначе -1.0
    yaw_scale: 1.0           # 360 / показанные градусы после полного оборота по метке

wifi_node:
  ros__parameters:
    iface: wlan0
    period_s: 20.0           # раз во сколько секунд спрашивать место по Wi-Fi (нужен интернет)
    active_scan_s: 120.0     # полное сканирование эфира (на секунды глушит связь с вебом) — не чаще
    key_file: /etc/atsd/locator.key   # ключ Яндекс Локатора; нет файла — бесплатный beaconDB
    min_aps: 2
    yandex_api: yandex       # yandex — api.lbs.yandex.net (ключ «API Локатора» работает здесь); yandex_v1 — новая версия
    daily_limit: 90          # запросов к Яндексу в день (бесплатно 100); дальше — beaconDB
    budget_file: /opt/atsd/data/locator_budget.json

gnss_node:
  ros__parameters:
    port: /dev/gnss
    baud: 115200
    frame_id: gnss_link
    min_satellites: 4
    configure_module: true
    nav_rate_hz: 1.67        # фикс раз в 0,6 с: чаще не нужно — путь между фиксами ведут колёса и гироскоп
    save_config: true
    fix_timeout_s: 3.0
    uere_m: 2.5
    gnss_systems: ''         # '' — как сохранено в приёмнике; GLONASS,BEIDOU — без GPS (глушат/подменяют GPS)

battery_node:
  ros__parameters:
    i2c_bus: 1
    address: 0x36
    cells: 4
    rate_hz: 1.0
    low_pct: 20.0

web_node:
  ros__parameters:
    mock: false
    port: 8080

v4l2_camera:
  ros__parameters:
    video_device: /dev/camera
    pixel_format: MJPG
    output_encoding: rgb8
    image_size: [1280, 720]
    camera_frame_id: camera_link
    time_per_frame: [1, 30]

lidar_node:
  ros__parameters:
    port: /dev/lidar
    baud: 230400
    frame_id: laser_frame
    topic: scan
    bins: 455
    range_min: 0.05
    range_max: 12.0
    min_intensity: 0
    invert: true
    angle_offset_deg: 0.0
    check_crc: true
    crop_deg: [0.0, 0.0]
    publish_every: 2         # каждый 2-й оборот: 5 сканов в секунду вместо 10
