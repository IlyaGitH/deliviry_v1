# АТСД-1М · параметры всех узлов
# USB: V5 /dev/v5, лидар /dev/lidar, камера /dev/camera · UART: GNSS /dev/gnss · I2C: X1202 0x36
# GPIO: 18 фары, 13 лента, 19 замок, 26 зуммер, 27 геркон · 6 и 16 заняты X1202

v5_bridge:
  ros__parameters:
    port: /dev/v5
    baud: 115200
    reconnect_s: 2.0
    link_timeout_s: 0.5
    cmd_rate_hz: 20.0
    cmd_timeout_s: 0.5
    heartbeat_hz: 10.0
    obstacle_max_hz: 15.0
    require_feeds: [obstacle]
    feed_timeout_s: 1.0
    odom_source: brain
    wheel_diameter_mm: 101.6
    track_mm: 430.0
    gear_ratio: 1.0
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    point_ids: [kpp, admin, testing, depot]   # = узлы 0..3 прошивки
    use_pose_correction: false

light_node:
  ros__parameters:
    headlight_pin: 18
    strip_pin: 13
    pwm_freq_hz: 200
    headlight_ceiling: 0.6   # шина 12 В ~1,4 А
    strip_ceiling: 0.5
    ramp_time_s: 0.5
    blink_period_s: 1.0
    beacon_period_s: 0.35
    dim_on_lock: true
    tick_hz: 50.0
    dry_run: false

lock_node:
  ros__parameters:
    lock_pin: 19
    door_sensor_pin: 27
    use_door_sensor: false
    pulse_time_s: 0.4
    cooldown_s: 3.0
    block_while_moving: true
    zone_policy: warn        # off | warn | require — BLE-метка точки для открытия
    dry_run: false

buzzer_node:
  ros__parameters:
    buzzer_pin: 26
    enabled: true
    max_continuous_s: 2.0
    dry_run: false

signal_node:
  ros__parameters:
    enabled: true
    tick_hz: 5.0
    head_moving: 1.0
    head_drl: 0.3
    strip_level: 1.0
    strip_idle: 0.3
    approach_m: 1.8
    crosswalk_beep_s: 4.0
    alarm_s: 6.0

obstacle_node:
  ros__parameters:
    scan_topic: scan
    laser_x: 0.29
    laser_y: 0.0
    laser_yaw_deg: 0.0
    front_x: 0.35            # замерить
    half_width: 0.25         # замерить
    margin: 0.10
    look_ahead: 2.5
    detour_offset: 0.65
    min_points: 3
    default_side: L
    on_count: 2
    off_count: 3
    report_offset: false

vision_node:
  ros__parameters:
    device: /dev/camera
    width: 640
    height: 480
    fps: 30
    model_path: /opt/atsd/models/signs_ncnn_model
    backend: auto            # ncnn без torch; ultralytics — запасной
    threads: 3
    imgsz: 640
    conf: 0.5
    infer_hz: 8.0
    focal_px: 460.0
    camera_to_front_m: 0.07
    sign_height_m: 0.30      # замерить
    light_height_m: 0.30     # замерить
    class_stop: [stop]
    class_cross: [crosswalk]
    class_bump: [bump_sign, bump_warn]
    class_light: [traffic_light]
    sign_confirm: 2
    light_confirm: 3
    max_sign_distance_m: 6.0
    light_lost_s: 2.0
    debug_image_hz: 2.0
    hsv_s_min: 90
    hsv_v_min: 140
    spot_enabled: true
    camera_x: 0.28           # как static TF base_link -> camera_link
    camera_y: 0.0
    camera_z: 0.385
    camera_pitch_deg: 10.0
    spot_s_min: 110
    spot_v_min: 60
    spot_min_area_m2: 0.02
    spot_max_area_m2: 2.5
    spot_max_range_m: 3.5

ble_node:
  ros__parameters:
    point_ids: [kpp, admin, testing, depot]
    names: [ATSD-KPP, ATSD-ADMIN, ATSD-TEST, ATSD-SKLAD]
    ibeacon_uuid: E2C56DB5-DFFB-48D2-B060-D0F5A71096E0
    ibeacon_minors: [1, 2, 3, 4]
    near_rssi: -65
    hysteresis: 5
    lost_s: 4.0
    rate_hz: 2.0
    adapter: hci0

gnss_node:
  ros__parameters:
    port: /dev/gnss
    baud: 115200
    frame_id: gnss_link
    min_satellites: 4
    configure_module: true
    nav_rate_hz: 5.0
    save_config: true
    fix_timeout_s: 3.0
    uere_m: 2.5

battery_node:
  ros__parameters:
    i2c_bus: 1
    address: 0x36
    cells: 4
    rate_hz: 1.0
    low_pct: 20.0

web_node:
  ros__parameters:
    mock: false
    port: 8080

v4l2_camera:
  ros__parameters:
    video_device: /dev/camera
    pixel_format: MJPG
    output_encoding: rgb8
    image_size: [1280, 720]
    camera_frame_id: camera_link
    time_per_frame: [1, 30]

lidar_node:
  ros__parameters:
    port: /dev/lidar
    baud: 230400
    frame_id: laser_frame
    topic: scan
    bins: 455
    range_min: 0.05
    range_max: 12.0
    min_intensity: 0
    invert: true
    angle_offset_deg: 0.0
    check_crc: true
    crop_deg: [0.0, 0.0]
