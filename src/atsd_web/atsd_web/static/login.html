<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>АТСД — вход</title><link rel="stylesheet" href="/static/style.css">
<body><main style="max-width:440px;margin:10vh auto;padding:24px"><h1>Вход в АТСД</h1>
<p id="purpose">Введите пароль администратора.</p>
<form id="loginForm"><label for="secret">Пароль или код доступа</label>
<input id="secret" type="password" autocomplete="current-password" required maxlength="256">
<button type="submit">Войти</button></form><p id="result" role="alert"></p>
<p>Для отправителя и получателя откройте персональную ссылку заказа на зарегистрированном устройстве.</p>
<script src="/static/login.js"></script></main></body></html>
